# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=dev.gamma
archives_base_name=gamma

# Dependencies
fabric_api_version=0.155.2+26.2
# Phase 5 chunk DB — bundled via Loom's Jar-in-Jar (see build.gradle `include`) so users
# don't install a native SQLite driver themselves.
sqlite_jdbc_version=3.47.1.0

# Test dependencies
junit_version=5.11.3
