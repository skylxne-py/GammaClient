name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          {
            echo "changelog<<GAMMA_CHANGELOG_EOF"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since $PREVIOUS_TAG:"
              echo
              git log "$PREVIOUS_TAG..${GITHUB_REF_NAME}" --pretty="format:- %s (%h)"
            else
              echo "Initial release."
            fi
            echo
            echo "GAMMA_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Strip non-distributable jars
        run: rm -f build/libs/*-sources.jar build/libs/*-dev.jar

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/*.jar \
            --title "${GITHUB_REF_NAME}" \
            --notes "${{ steps.changelog.outputs.changelog }}"
